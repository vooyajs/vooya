name: Experimental integrations

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      managed_source:
        description: Managed consumer source (registry is a release acceptance run)
        type: choice
        options: [packed, registry]
        default: packed

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}-${{ inputs.managed_source || 'packed' }}
  cancel-in-progress: true

jobs:
  browser:
    if: ${{ inputs.managed_source != 'registry' }}
    name: ${{ matrix.script }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        script: [test:rust-octane, test:rust-bundlers, test:vite8-frameworks, test:vite-plus, test:vite-plus-frameworks]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.115-${{ runner.os }}
      - name: Install wasm-bindgen CLI
        run: |
          if ! wasm-bindgen --version 2>/dev/null | grep -Fx 'wasm-bindgen 0.2.115'; then
            cargo install wasm-bindgen-cli --version 0.2.115 --locked --force
          fi
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run ${{ matrix.script }}

  managed-toolchain:
    name: Managed toolchain (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Validate managed consumer mode
        run: node -e "if (!['packed', 'registry'].includes(process.env.MANAGED_SOURCE)) throw new Error('Invalid managed consumer mode')"
        env:
          MANAGED_SOURCE: ${{ inputs.managed_source || 'packed' }}
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      # The packed consumer shields system Rust, keeps the native SDK/linker,
      # and verifies managed selection plus real browser dev/error recovery.
      - if: ${{ inputs.managed_source != 'registry' }}
        run: npm run test:preset-consumer
      - if: ${{ inputs.managed_source == 'registry' }}
        run: npm run test:preset-registry
        env:
          VOOYA_PRESET_EVIDENCE_DIR: preset-registry-evidence
      - if: ${{ always() && inputs.managed_source == 'registry' }}
        uses: actions/upload-artifact@v4
        with:
          name: preset-registry-${{ matrix.os }}
          path: preset-registry-evidence
          if-no-files-found: warn
