name: Release

on:
  workflow_dispatch:
    inputs:
      action:
        description: Prepare a version PR or publish an already reviewed version commit
        type: choice
        options: [prepare, publish]
        required: true
      sha:
        description: Full reviewed commit SHA; must equal the selected release branch HEAD
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: vooya-release
  cancel-in-progress: false

jobs:
  version:
    if: inputs.action == 'prepare' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/0.1')
    name: Prepare release pull request
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Verify reviewed release branch and commit
        env:
          REVIEWED_SHA: ${{ inputs.sha }}
        run: |
          test "$REVIEWED_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const line = JSON.parse(readFileSync(".changeset/line.json", "utf8"));
          const valid = (line.branch === "main" && line.channel === "alpha" && line.baseVersion === "0.2.0") || (line.branch === "release/0.1" && line.channel === "beta" && line.baseVersion === "0.1.0");
          if (!valid || process.env.GITHUB_REF !== `refs/heads/${line.branch}`) throw new Error("Release line does not match the workflow branch.");
          NODE
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: node scripts/verify-lockfile-registry.mjs
      - run: npm ci --ignore-scripts
      - name: Create or update release PR
        id: changesets
        uses: changesets/action@66d7d1ddafddf1ef45f98ee51a7496f9cdadb2f4 # v2.1.2, Changesets CLI v3
        with:
          version-script: npm run version:packages
          pr-title: 'chore: release packages'
          commit-message: 'chore: release packages'
      # PR checks created with GITHUB_TOKEN may wait for manual approval.
      # Explicit dispatch runs checks on this trusted generated release branch.
      - name: Run checks on the generated release PR
        if: steps.changesets.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.changesets.outputs.pr-number }}
        run: |
          release_ref=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq .head.ref)
          release_sha=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq .head.sha)
          existing=$(gh api "repos/$GH_REPO/actions/workflows/verify.yml/runs?head_sha=$release_sha&per_page=100" --jq '.workflow_runs | length')
          if [ "$existing" = "0" ]; then
            gh workflow run verify.yml --ref "$release_ref"
          else
            echo "Checks already exist for $release_sha; inspect or rerun that run instead of dispatching a duplicate."
          fi

  publish:
    if: inputs.action == 'publish' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/0.1')
    name: Validate and publish release commit
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Require the exact reviewed release commit
        env:
          REVIEWED_SHA: ${{ inputs.sha }}
        run: |
          test "$REVIEWED_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
          git diff --exit-code
          git diff --quiet HEAD^ HEAD -- .changeset/release.json && exit 1
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const line = JSON.parse(readFileSync(".changeset/line.json", "utf8"));
          const valid = (line.branch === "main" && line.channel === "alpha" && line.baseVersion === "0.2.0") || (line.branch === "release/0.1" && line.channel === "beta" && line.baseVersion === "0.1.0");
          if (!valid || process.env.GITHUB_REF !== `refs/heads/${line.branch}`) throw new Error("Release line does not match the workflow branch.");
          NODE
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rust-analyzer

      - name: Restore wasm-bindgen CLI cache
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.115-${{ runner.os }}

      - name: Install wasm-bindgen CLI
        run: |
          if ! wasm-bindgen --version 2>/dev/null | grep -Fx 'wasm-bindgen 0.2.115'; then
            cargo install wasm-bindgen-cli --version 0.2.115 --locked --force
          fi
          wasm-bindgen --version | grep -Fx 'wasm-bindgen 0.2.115'

      - run: node scripts/verify-lockfile-registry.mjs
      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install browser for release acceptance
        run: npx playwright install --with-deps chromium

      - name: Read the reviewed prerelease channel
        id: channel
        run: |
          npm run build:scripts
          channel=$(node --input-type=module -e 'import { readReleaseChannel } from "./scripts/generated/release-channel.js"; console.log(readReleaseChannel(process.cwd()));')
          echo "name=$channel" >> "$GITHUB_OUTPUT"
      - name: Restore the original protected-tag baseline on retries
        id: baseline
        uses: actions/cache/restore@v4
        with:
          path: .vooya-tools/release/${{ github.sha }}/latest-before.json
          key: ${{ steps.channel.outputs.name }}-protected-tags-${{ github.sha }}
      - name: Capture protected tags before any publication
        if: steps.baseline.outputs.cache-hit != 'true'
        run: |
          if [ "$GITHUB_RUN_ATTEMPT" != "1" ]; then
            echo 'Original baseline is missing. Restore latest-before.json from the first attempt artifact before retrying.' >&2
            exit 1
          fi
          npm run build:scripts
          mkdir -p ".vooya-tools/release/$GITHUB_SHA"
          node scripts/generated/sync-alpha-dist-tags.js --capture-latest ".vooya-tools/release/$GITHUB_SHA/latest-before.json"
      - name: Persist baseline before any publication
        if: steps.baseline.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .vooya-tools/release/${{ github.sha }}/latest-before.json
          key: ${{ steps.channel.outputs.name }}-protected-tags-${{ github.sha }}
      - name: Preserve the baseline before publishing
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.channel.outputs.name }}-baseline-${{ github.sha }}-${{ github.run_attempt }}
          path: .vooya-tools/release/${{ github.sha }}/latest-before.json
          if-no-files-found: error
          retention-days: 90
      - name: Validate, publish, and verify the same commit
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_CHANNEL: ${{ steps.channel.outputs.name }}
          VOOYA_RELEASE_SHA: ${{ inputs.sha }}
        run: node scripts/generated/publish-alpha.js --channel "$RELEASE_CHANNEL"
      - name: Create missing package GitHub Releases after acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/generated/create-github-releases.js
      - name: Preserve release evidence and recovery baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.channel.outputs.name }}-release-${{ github.sha }}-${{ github.run_attempt }}
          path: .vooya-tools/release/${{ github.sha }}/
          if-no-files-found: ignore
          retention-days: 90
