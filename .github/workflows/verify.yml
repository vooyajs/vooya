name: Verify

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-policy:
    name: Release metadata and changeset policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify:release-metadata
      - name: Check changed packages and preserve changelog history
        env:
          RELEASE_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
        run: node scripts/generated/verify-change-policy.js --base "$RELEASE_BASE"
      - run: npm run test:release-contract

  source-compatibility:
    name: Source quickstart (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20
          - os: macos-latest
            node: 22
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Restore wasm-bindgen CLI cache
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.115-${{ runner.os }}

      - name: Install wasm-bindgen CLI
        run: |
          if ! wasm-bindgen --version 2>/dev/null | grep -Fx 'wasm-bindgen 0.2.115'; then
            cargo install wasm-bindgen-cli --version 0.2.115 --locked --force
          fi
          wasm-bindgen --version | grep -Fx 'wasm-bindgen 0.2.115'

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify source quickstarts
        run: npm run test:quickstart

  windows-source-quickstart:
    name: Windows source quickstart
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Restore wasm-bindgen CLI cache
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/wasm-bindgen.exe
          key: wasm-bindgen-cli-0.2.115-${{ runner.os }}

      - name: Install wasm-bindgen CLI
        shell: pwsh
        run: |
          $expected = 'wasm-bindgen 0.2.115'
          $installed = Get-Command wasm-bindgen -ErrorAction SilentlyContinue
          if (-not $installed -or ((wasm-bindgen --version) -ne $expected)) {
            cargo install wasm-bindgen-cli --version 0.2.115 --locked --force
          }
          if ((wasm-bindgen --version) -ne $expected) {
            throw "Expected $expected"
          }

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify release metadata
        run: npm run verify:release-metadata

      # This is intentionally a source-only contract: each fixture installs
      # packed local packages, runs the installed `vooya doctor`, and emits a
      # production WASM bundle. Browser support is verified separately.
      - name: Verify source quickstarts
        run: npm run test:quickstart

  verify:
    name: Release gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rust-analyzer

      - name: Restore wasm-bindgen CLI cache
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.115-${{ runner.os }}

      - name: Install wasm-bindgen CLI
        run: |
          if ! wasm-bindgen --version 2>/dev/null | grep -Fx 'wasm-bindgen 0.2.115'; then
            cargo install wasm-bindgen-cli --version 0.2.115 --locked --force
          fi
          wasm-bindgen --version | grep -Fx 'wasm-bindgen 0.2.115'

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify release metadata
        run: npm run verify:release-metadata

      # Browser E2E and bundler browser matrices remain part of the local
      # release gate (`npm run verify:release`), not routine pull-request CI.
      - name: Run CI verification
        run: npm run verify:ci
