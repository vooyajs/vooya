name: Verify

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  source-compatibility:
    name: Source quickstart (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20
          - os: macos-latest
            node: 22
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Restore wasm-bindgen CLI cache
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.115-${{ runner.os }}

      - name: Install wasm-bindgen CLI
        run: |
          if ! wasm-bindgen --version 2>/dev/null | grep -Fx 'wasm-bindgen 0.2.115'; then
            cargo install wasm-bindgen-cli --version 0.2.115 --locked --force
          fi
          wasm-bindgen --version | grep -Fx 'wasm-bindgen 0.2.115'

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify source quickstarts
        run: npm run test:quickstart

  windows-source-quickstart:
    name: Windows source quickstart
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Restore wasm-bindgen CLI cache
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/wasm-bindgen.exe
          key: wasm-bindgen-cli-0.2.115-${{ runner.os }}

      - name: Install wasm-bindgen CLI
        shell: pwsh
        run: |
          $expected = 'wasm-bindgen 0.2.115'
          $installed = Get-Command wasm-bindgen -ErrorAction SilentlyContinue
          if (-not $installed -or ((wasm-bindgen --version) -ne $expected)) {
            cargo install wasm-bindgen-cli --version 0.2.115 --locked --force
          }
          if ((wasm-bindgen --version) -ne $expected) {
            throw "Expected $expected"
          }

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify Semifold release contract
        env:
          SEMIFOLD_BIN: ${{ github.workspace }}/.vooya-tools/semifold/semifold-windows-x86_64.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path (Split-Path $env:SEMIFOLD_BIN) | Out-Null
          Invoke-WebRequest https://github.com/noctisynth/semifold/releases/download/semifold-v0.3.0/semifold-windows-x86_64.exe -OutFile $env:SEMIFOLD_BIN
          if ((Get-FileHash $env:SEMIFOLD_BIN -Algorithm SHA256).Hash.ToLower() -ne 'e269d155fdd230f9341186cfcb156167b2fd2dcef2a4b617bf8cc78ae7d369c3') { throw 'Semifold checksum mismatch' }
          npm run release:status

      # This is intentionally a source-only contract: each fixture installs
      # packed local packages, runs the installed `vooya doctor`, and emits a
      # production WASM bundle. Browser support is verified separately.
      - name: Verify source quickstarts
        run: npm run test:quickstart

  verify:
    name: Release gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rust-analyzer

      - name: Restore wasm-bindgen CLI cache
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.115-${{ runner.os }}

      - name: Install wasm-bindgen CLI
        run: |
          if ! wasm-bindgen --version 2>/dev/null | grep -Fx 'wasm-bindgen 0.2.115'; then
            cargo install wasm-bindgen-cli --version 0.2.115 --locked --force
          fi
          wasm-bindgen --version | grep -Fx 'wasm-bindgen 0.2.115'

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify Semifold release contract
        env:
          SEMIFOLD_BIN: ${{ github.workspace }}/.vooya-tools/semifold/semifold-linux-x86_64
        run: |
          mkdir -p "$(dirname "$SEMIFOLD_BIN")"
          curl --fail --location --retry 3 https://github.com/noctisynth/semifold/releases/download/semifold-v0.3.0/semifold-linux-x86_64 -o "$SEMIFOLD_BIN"
          echo '5800bc9389e230bead6cf23ca528928b872a719c90034a940a52270c57424324  '"$SEMIFOLD_BIN" | sha256sum --check --strict
          chmod +x "$SEMIFOLD_BIN"
          npm run release:status

      - name: Install Chromium for smoke coverage
        run: npx playwright install --with-deps chromium

      # This command is deliberately verification-only. Publishing and npm
      # dist-tag inspection remain explicit maintainer actions in release:alpha.
      - name: Run release gate
        run: npm run verify:ci
