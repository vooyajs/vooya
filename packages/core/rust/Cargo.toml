[package]
name = "vooya-core"
version = "0.0.0"
description = "Core runtime for Vooya components."
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vooyajs/vooya"

[lib]
path = "src/lib.rs"

[dependencies]
wasm-bindgen = "=0.2.115"
web-sys = { version = "=0.3.92", features = [
  "Document",
  "Element",
  "Event",
  "EventTarget",
  "HtmlCollection",
  "CustomEvent",
  "CustomEventInit",
] }
