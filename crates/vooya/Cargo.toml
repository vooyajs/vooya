[package]
name = "vooya"
version = "0.1.0"
description = "User-facing Rust runtime for Vooya components and state stores."
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
vooya-core = { path = "../../packages/core/rust" }
vooya-macros = { path = "../vooya-macros" }
wasm-bindgen = "=0.2.115"
js-sys = "=0.3.92"
web-sys = { version = "=0.3.92", features = [
  "CustomEvent",
  "CustomEventInit",
  "Element",
  "Node",
] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
