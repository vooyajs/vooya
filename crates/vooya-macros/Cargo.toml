[package]
name = "vooya-macros"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Procedural macros for Vooya Rust-file authoring."

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
serde_json = "1"
syn = { version = "2", features = ["full"] }
